name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Publica quando a versão do package.json ainda não tem Release (ou quando uma tag v* é enviada)
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION já existe"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Ferramentas de empacotamento (rpm, pacman)
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd
      - run: npm ci
      - run: npx electron-builder --linux deb rpm pacman AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage

  windows:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependências (${{ matrix.arch }})
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cpu: ${{ matrix.arch }}
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Notas da versão (CHANGELOG.md)
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'MD'

          ---

          ### Downloads

          | Sistema | Arquivo |
          |---|---|
          | Windows 10/11 | `GCP-Converter-Setup-*-x64.exe` |
          | macOS Apple Silicon (M1+) | `GCP-Converter-*-arm64.dmg` |
          | macOS Intel | `GCP-Converter-*-x64.dmg` |
          | Debian / Ubuntu / Mint | `GCP-Converter-*-amd64.deb` |
          | Fedora / openSUSE | `GCP-Converter-*-x86_64.rpm` |
          | Arch / BigLinux / Manjaro | `GCP-Converter-*-x86_64.pkg.tar.zst` |
          | Qualquer Linux | `GCP-Converter-*-x86_64.AppImage` |

          Desenvolvido por [Bruno Albertini | Gestão Cultural Pro](https://www.gestaoculturalpro.com.br)
          MD
          sed -i 's/^          //' notes.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          TAG="v${{ needs.check.outputs.version }}"
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "GCP Converter $TAG" \
            --notes-file notes.md
