name: Pacote Arch corrigido (v1.0.0)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-arch-1.0.0.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verificar se a Release v1.0.0 já tem o pacote
        id: chk
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q 'pkg.tar.zst$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip == 'false'
        with: { ref: v1.0.0 }
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip == 'false'
        with: { node-version: 22 }
      - name: Aplicar a correção do pacote Arch
        if: steps.chk.outputs.skip == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
          node -e "
            const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            const pk=p.build.pacman;
            pk.depends=['gtk3','nss','alsa-lib','libxss','libxtst','libnotify','mesa','at-spi2-core','xdg-utils'];
            pk.fpm=pk.fpm.concat(['--description','Conversor universal de video, audio, imagens, documentos e e-books']);
            fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      - name: Compilar
        if: steps.chk.outputs.skip == 'false'
        run: |
          npm ci
          npx electron-builder --linux pacman --x64 --publish never
          bsdtar -xOf dist/*.pkg.tar.zst .PKGINFO | grep -E '^(pkgver|pkgdesc|depend)'
      - name: Anexar na Release v1.0.0
        if: steps.chk.outputs.skip == 'false'
        run: gh release upload v1.0.0 dist/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
